<!doctype html>
<!--
  Source for the square app icons in public/ (apple-touch-icon.png 180, icon-192.png, icon-512.png).
  Everything scales with the window, so screenshot it at each size, for example:
    msedge --headless --disable-gpu --hide-scrollbars --window-size=512,512 ^
      --screenshot=apps/client/public/icon-512.png apps/client/branding/app-icon.html
  The card sits inside the central 80% so the icon also works as a maskable icon.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Lilita One';
        src: url('../../../node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2');
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(closest-side, #5d2c58 0%, #4b2347 60%, #2c1430 100%);
      }
      .card {
        position: relative;
        width: 46vw;
        height: 64vw;
        border: 4.4vw solid #fff;
        border-radius: 7vw;
        background: #e5383b;
        transform: rotate(-8deg);
        box-shadow: 0 3vw 5vw rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      .card::before {
        content: '';
        position: absolute;
        inset: 12%;
        border-radius: 50%;
        background: #fff;
        transform: rotate(28deg);
      }
      .face {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Lilita One', sans-serif;
        font-size: 30vw;
        color: #a3161a;
        paint-order: stroke fill;
        -webkit-text-stroke: 1.6vw rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="card"><span class="face">!</span></div>
  </body>
</html>
