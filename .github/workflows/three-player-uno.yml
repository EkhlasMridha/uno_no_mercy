name: 3-player UNO game

on:
  pull_request:
    branches: [main, develop]

# Its own group: sharing ci.yml's would let the two workflows cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  three-player-uno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Three players play to a winner, calling UNO, arming it and getting caught
        run: npm test -w @nomercy/server -- three-player-uno
